services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 9000
      NODE_ENV: production
      MONGO_URI: ${MONGO_URI:?Set the MongoDB Atlas connection string}
      JWT_SECRET: ${JWT_SECRET:?Set a long, unique JWT secret}
      CLIENT_URL: ${CLIENT_URL:?Set the public frontend origin}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-none}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      SEED_ON_START: ${SEED_ON_START:-false}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-}
    ports:
      - "${API_PORT:-9000}:9000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:9000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:?Set the public API origin}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

  ai:
    profiles: ["ai"]
    build:
      context: ./ai_services
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MONGO_URI: ${MONGO_URI:?Set the MongoDB Atlas connection string}
      DB_NAME: ${DB_NAME:-expense_tracker}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    expose:
      - "8000"
