name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Install, lint, test, and build
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      MONGO_URI: mongodb://127.0.0.1:27017/expense_tracker_test?replicaSet=rs0
      JWT_SECRET: ci-test-secret-with-at-least-32-characters
      CLIENT_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Backend tests
        run: npm test

      - name: Frontend lint
        run: npm run lint
        working-directory: frontend

      - name: Frontend production build
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: https://api.example.invalid

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  docker:
    name: Build production containers
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      JWT_SECRET: ci-only-build-secret-with-at-least-32-characters
      MONGO_URI: mongodb://mongodb:27017/expense_tracker?replicaSet=rs0
      CLIENT_URL: https://app.example.invalid
      VITE_API_URL: https://api.example.invalid
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build local Compose services
        run: docker compose build

      - name: Build optional AI image
        run: docker build -f ai_services/Dockerfile ai_services
