name: CI — Lint, Test & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ──────────────────────────────────────────────
  # 1. Backend — lint + tests (with MongoDB RS)
  # ──────────────────────────────────────────────
  backend:
    name: Backend — Test & Lint
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        # Replica set required for transactions and change streams
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: 9001
      MONGO_URI: mongodb://localhost:27017/expense_tracker_test?replicaSet=rs0
      JWT_SECRET: ci-test-secret-32-characters-long-xx
      CLIENT_URL: http://localhost:5173
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      # Initiate MongoDB replica set (needed for ACID transactions)
      - name: Initiate MongoDB replica set
        run: |
          sleep 3
          mongosh --eval "rs.initiate({_id:'rs0', members:[{_id:0, host:'localhost:27017'}]})"
          sleep 3
          mongosh --eval "rs.status()"

      - name: Run backend tests
        run: npm test
        working-directory: backend

  # ──────────────────────────────────────────────
  # 2. Frontend — lint + build
  # ──────────────────────────────────────────────
  frontend:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:9000
        working-directory: frontend

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ──────────────────────────────────────────────
  # 3. Docker Compose smoke test
  # ──────────────────────────────────────────────
  docker-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Only run on main branch pushes to save CI minutes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create backend .env for CI
        run: |
          echo "MONGO_URI=mongodb://mongodb:27017/expense_tracker?replicaSet=rs0" > backend/.env
          echo "JWT_SECRET=ci-docker-smoke-secret-32-chars-xx" >> backend/.env
          echo "PORT=9000" >> backend/.env
          echo "CLIENT_URL=http://localhost:5173" >> backend/.env
          echo "NODE_ENV=production" >> backend/.env

      - name: Start services
        run: docker compose up -d --build
        timeout-minutes: 10

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:9000/api/health || echo "000")
            echo "Attempt $i: HTTP $status"
            if [ "$status" = "200" ] || [ "$status" = "503" ]; then
              echo "Backend responded"
              break
            fi
            sleep 5
          done

      - name: Health check
        run: curl -f http://localhost:9000/api/health

      - name: Stop services
        if: always()
        run: docker compose down -v
